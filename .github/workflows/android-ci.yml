name: CI Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar y ejecutar pruebas
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: feribot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
